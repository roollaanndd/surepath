<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shield-fill" x1="20" y1="20" x2="180" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bg-fill" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="200" height="200" rx="52" fill="url(#bg-fill)"/>

  <!-- Shield body -->
  <path d="M100 22 L170 50 L170 108 C170 150 136 176 100 190 C64 176 30 150 30 108 L30 50 Z"
        fill="url(#shield-fill)" filter="url(#shadow)"/>

  <!-- Checkmark / path symbol -->
  <path d="M68 106 L88 126 L134 76"
        stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orange accent dot at shield top -->
  <circle cx="100" cy="36" r="7" fill="#f97316" opacity="0.9"/>
</svg>
