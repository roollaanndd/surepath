# SurePath — konfigurasi Supabase CLI.
#
# KENAPA BERKAS INI ADA
#
# Tanpa `config.toml`, integrasi GitHub Supabase hanya menjalankan migrasi dan
# men-deploy NOL edge function: yang dideploy hanyalah fungsi yang dideklarasikan
# di sini. Itu sebabnya berkas ini menjadi prasyarat untuk menyalakan deploy
# otomatis dari dashboard Supabase (Project Settings → Integrations → GitHub),
# jalur yang TIDAK memerlukan secret apa pun di GitHub.
#
# Berkas ini juga dibaca oleh `supabase functions deploy`, sehingga setelan
# verify_jwt tidak lagi tersebar antara CLI, workflow CI, dan dashboard —
# satu sumber kebenaran.
#
# SENGAJA MINIMAL. Hanya `project_id` dan blok `[functions.*]`. Tidak ada blok
# [api]/[auth]/[db] supaya tidak ada satu pun setelan layanan produksi yang
# ikut tertimpa saat deploy.
#
# NILAI verify_jwt DI BAWAH awalnya cerminan persis produksi per 10 Sep 2026
# (dibaca lewat Management API). v2.5.2 sengaja menyimpang di DUA tempat, dan
# keduanya adalah perbaikan cacat yang dijelaskan di komentarnya masing-masing:
#
#   • xendit-webhook  true → false  (produksi salah; akan gagal di pembayaran
#                                    pertama karena callback ditolak platform)
#   • send-insurer-email            (belum pernah ter-deploy padahal dipanggil
#                                    klien; alur review insurer mati di ujung)
#
# Selain dua itu, berkas ini tetap menuliskan keadaan yang sudah berjalan.
# Ubah nilainya hanya dengan sengaja, bukan sebagai efek samping.

project_id = "uyjgeteelnswphyzkjwi"

# ── Gateway: verify_jwt = false karena mengautentikasi sendiri di dalam kode ──
# data-gateway memverifikasi Bearer JWT untuk action privat dan memakai
# allowlist PUBLIC_ACTIONS untuk sisanya; quotations-gateway melayani halaman
# publik /q/{code}. Keduanya dulu di-deploy dengan flag `--no-verify-jwt`.

[functions.data-gateway]
verify_jwt = false

[functions.quotations-gateway]
verify_jwt = false

# Dipicu jadwal/cron, bukan sesi pengguna.
[functions.daily-report]
verify_jwt = false

[functions.insurer-reminder-cron]
verify_jwt = false

# ── Selebihnya: JWT diverifikasi platform lebih dulu ──────────────────────────

[functions.pathy-agent]
verify_jwt = true

[functions.ai-proxy]
verify_jwt = true

[functions.ai-policy-review]
verify_jwt = true

[functions.ai-finance-review]
verify_jwt = true

[functions.analyze-claim-photos]
verify_jwt = true

[functions.stnk-ocr]
verify_jwt = true

[functions.ocr-scan]
verify_jwt = true

[functions.create-xendit-invoice]
verify_jwt = true

[functions.xendit-disburse]
verify_jwt = true

# ── PERBAIKAN CACAT (v2.5.2): webhook Xendit tidak boleh minta JWT ───────────
#
# Produksi menyetel verify_jwt = true untuk fungsi ini. Itu salah, dan akan
# meledak pada pembayaran pertama yang benar-benar masuk.
#
# `xendit-webhook/index.ts` mengautentikasi dengan `x-callback-token` milik
# Xendit dan sudah fail-closed: token tidak cocok → 401. Ia tidak pernah
# mengharapkan JWT pengguna. Dengan verify_jwt = true, platform Supabase
# menolak request dengan 401 SEBELUM fungsinya sempat jalan, sehingga
# pengecekan `x-callback-token` itu tidak pernah tereksekusi — dan callback
# Xendit tidak akan pernah sampai. Akibatnya pembayaran tidak pernah ditandai
# PAID, komisi tidak pernah dikredit, dan insurer tidak pernah dinotifikasi.
#
# Belum ada yang menyadarinya karena `sp_payments` masih kosong: platform belum
# pernah memproses satu pembayaran pun (order terakhir Juli 2026). Jadi ini
# ranjau pra-peluncuran, bukan kerusakan yang sedang berjalan.
#
# Alasannya sama persis dengan data-gateway: fungsi yang mengautentikasi
# sendiri dengan mekanismenya sendiri tidak boleh dijaga ganda oleh JWT gate
# platform yang tidak paham mekanisme itu.
[functions.xendit-webhook]
verify_jwt = false

[functions.financing-api]
verify_jwt = true

[functions.submit-policy-insurer]
verify_jwt = true

[functions.notify-admin]
verify_jwt = true

[functions.send-otp]
verify_jwt = true

[functions.verify-otp]
verify_jwt = true

[functions.send-whatsapp]
verify_jwt = true

# ── PERBAIKAN CACAT (v2.5.2): send-insurer-email memang dipanggil klien ──────
#
# Sebelumnya fungsi ini dibiarkan tidak dideklarasikan dengan alasan
# "menghidupkan endpoint baru = keputusan produk". Alasan itu keliru setelah
# dicek: `services/website.ts` MEMANGGILNYA lewat
# `supabase.functions.invoke('send-insurer-email', …)` — sesudah menerbitkan
# token insurer dan menyusun review URL. Fungsinya tidak ada di produksi, jadi
# panggilan itu gagal dan insurer tidak pernah menerima email review-link.
#
# Jadi mendeklarasikannya bukan menambah fitur, melainkan memperbaiki langkah
# terakhir alur review insurer (v1.20.0–v1.22.0) yang selama ini mati diam-diam.
#
# verify_jwt = true benar di sini: fungsinya dipanggil dari sesi pengguna yang
# sudah login, dan di dalamnya masih ada `verifyAuth` + `adminOnly`.
[functions.send-insurer-email]
verify_jwt = true

# ── Ada di repo, TIDAK ada di produksi — sengaja dibiarkan mati ───────────────
#
# ai-gateway hanya kembaran dari AI gateway lokal di `server.ts`. Klien
# menjangkaunya lewat `/api/ai-gateway`, yang menurut CLAUDE.md hanya ada saat
# `npm run dev` (di produksi jalur itu 404 dan `services/aiGateway.ts` hanya
# mencobanya bila `import.meta.env.DEV`). Tidak ada yang memanggil versi edge
# function-nya, jadi mendeklarasikannya hanya akan menambah permukaan serang.
#
# Baris di bawah dibaca `scripts/check-edge-functions.mjs`: ia mewajibkan setiap
# fungsi di repo punya sikap TERTULIS — dideklarasikan, atau dinyatakan sengaja
# mati berikut alasannya. Diam tidak diperbolehkan, karena diam persis yang
# membuat send-insurer-email hilang berbulan-bulan tanpa ketahuan.
#!undeclared ai-gateway — kembaran AI gateway lokal `server.ts` (`/api/ai-gateway`, hanya ada saat `npm run dev`); versi edge function-nya tidak punya pemanggil

