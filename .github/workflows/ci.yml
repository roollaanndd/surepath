# SurePath CI — Quality Gate
# Runs on every push to main + every PR.
# Checks: TypeScript, ESLint, build, unit tests, browser smoke tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Edge function declarations
        run: node scripts/check-edge-functions.mjs

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

      - name: ESLint
        run: npx eslint components/ services/ src/ App.tsx

      - name: Build and verify deployable output
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-key' }}

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  # Audit H3 (2026-10-25): supabase/functions is excluded from the root
  # tsconfig, so edge functions had NO type-check anywhere — this is how the
  # xendit-webhook referral block shipped referencing an out-of-scope variable
  # (TS2304) with zero CI signal. `deno check` is the edge-runtime's own
  # compiler; it is now a blocking gate. Config lives in
  # supabase/functions/deno.json (+ package.json for npm: specifiers).
  edge-function-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check edge functions
        working-directory: supabase/functions
        run: |
          deno install
          deno check .

  browser-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local browser smoke tests
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
