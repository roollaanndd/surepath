name: ECC AgentShield Isolation POC

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - '.agents/**'
      - '.claude/**'
      - '.mcp.json'
      - '.github/workflows/ecc-agentshield-poc.yml'

permissions:
  contents: read

jobs:
  isolated-preflight-and-config-scan:
    name: Audit pinned ECC tools and scan agent configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      npm_config_ignore_scripts: 'true'
      CI: 'true'
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact official packages without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ecc-poc"
          mkdir -p "$WORK/packs"
          cd "$WORK/packs"
          npm pack ecc-universal@2.2.3 --ignore-scripts --json > ecc-pack.json
          npm pack ecc-agentshield@1.6.0 --ignore-scripts --json > shield-pack.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const [file, expectedName, expectedVersion] of [
            ['ecc-pack.json', 'ecc-universal', '2.2.3'],
            ['shield-pack.json', 'ecc-agentshield', '1.6.0']
          ]) {
            const [pack] = JSON.parse(fs.readFileSync(file, 'utf8'));
            const tarball = pack.filename;
            const manifest = JSON.parse((await import('node:child_process')).execFileSync(
              'tar', ['-xOf', tarball, 'package/package.json'], { encoding: 'utf8' }
            ));
            if (manifest.name !== expectedName || manifest.version !== expectedVersion) {
              throw new Error(`Unexpected package identity for ${file}`);
            }
            if (manifest.license !== 'MIT') throw new Error(`Unexpected license for ${expectedName}`);
            const lifecycle = ['preinstall', 'install', 'postinstall', 'prepare']
              .filter((name) => typeof manifest.scripts?.[name] === 'string');
            console.log(JSON.stringify({
              name: manifest.name,
              version: manifest.version,
              license: manifest.license,
              lifecycleScripts: lifecycle,
              dependencies: Object.keys(manifest.dependencies ?? {}).length
            }));
            if (lifecycle.length) throw new Error(`${expectedName} has lifecycle scripts; manual review required`);
          }
          NODE

      - name: Install packages in disposable directories with scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ecc-poc"
          mkdir -p "$WORK/ecc" "$WORK/shield"
          ECC_TGZ="$(find "$WORK/packs" -maxdepth 1 -name 'ecc-universal-2.2.3.tgz' -print -quit)"
          SHIELD_TGZ="$(find "$WORK/packs" -maxdepth 1 -name 'ecc-agentshield-1.6.0.tgz' -print -quit)"
          test -n "$ECC_TGZ" && test -n "$SHIELD_TGZ"
          (cd "$WORK/ecc" && npm install --ignore-scripts --no-audit --no-fund "$ECC_TGZ")
          (cd "$WORK/shield" && npm install --ignore-scripts --no-audit --no-fund "$SHIELD_TGZ")

      - name: Audit both runtime dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          npm audit --prefix "$RUNNER_TEMP/ecc-poc/ecc" --omit=dev --audit-level=high
          npm audit --prefix "$RUNNER_TEMP/ecc-poc/shield" --omit=dev --audit-level=high

      - name: Smoke-test CLIs without credentials or write access
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/ecc-poc-home"
          mkdir -p "$HOME"
          "$RUNNER_TEMP/ecc-poc/ecc/node_modules/.bin/ecc" --help >/dev/null
          "$RUNNER_TEMP/ecc-poc/shield/node_modules/.bin/agentshield" --help >/dev/null

      - name: Scan repository agent configuration read-only
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/agentshield-report.json"
          set +e
          "$RUNNER_TEMP/ecc-poc/shield/node_modules/.bin/agentshield" scan --path "$GITHUB_WORKSPACE/.github" --format json > "$REPORT" 2>/dev/null
          SCAN_EXIT=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportPath = process.env.RUNNER_TEMP + '/agentshield-report.json';
          let raw = fs.readFileSync(reportPath, 'utf8').trim();
          const start = raw.indexOf('{');
          if (start < 0) throw new Error('AgentShield did not emit a JSON report');
          raw = raw.slice(start);
          const report = JSON.parse(raw);
          const findings = Array.isArray(report.findings) ? report.findings : [];
          const count = (level) => findings.filter(f =>
            String(f.severity ?? f.level ?? f.risk ?? '').toLowerCase() === level
          ).length;
          // Never print finding evidence or snippets into public CI logs.
          console.log(JSON.stringify({
            scanner: 'ecc-agentshield@1.6.0',
            scope: '.github',
            findingCount: findings.length,
            critical: count('critical'),
            high: count('high'),
            medium: count('medium'),
            low: count('low'),
            scannerExitCode: Number(process.env.SCAN_EXIT ?? 0)
          }, null, 2));
          NODE
          if [ "$SCAN_EXIT" -ne 0 ]; then
            echo "AgentShield returned a non-zero result; inspect privately before changing the gate."
            exit "$SCAN_EXIT"
          fi
