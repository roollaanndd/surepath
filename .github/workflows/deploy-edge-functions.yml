# SurePath — Edge Function Auto-Deploy
#
# Deploys Supabase edge functions from the repo's real source on every push to
# main that touches supabase/functions/**. This removes the long-standing manual
# `supabase functions deploy` step that repeatedly left the production
# data-gateway bundle stale behind the repo (see CHANGELOG v1.51–v1.53 deploy
# notes).
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — uyjgeteelnswphyzkjwi
#
# Until those secrets are set, this workflow no-ops with a clear message instead
# of failing the run.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names to deploy (blank = data-gateway)'
        required: false
        default: 'data-gateway'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — secrets present?
        id: guard
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set — skipping edge-function deploy. Add them in repo Settings → Secrets to enable auto-deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.guard.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        if: steps.guard.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # On manual dispatch, deploy the requested set; on push, deploy data-gateway
          # (the only function that carries app logic reached from the browser).
          FUNCTIONS: ${{ github.event.inputs.functions || 'data-gateway' }}
        run: |
          set -euo pipefail
          for fn in $FUNCTIONS; do
            echo "Deploying $fn to $PROJECT_REF ..."
            # data-gateway authenticates internally (Bearer JWT verified in code
            # for private actions; PUBLIC_ACTIONS allowlist for the rest), so it
            # runs with --no-verify-jwt exactly as the manual deploys did.
            if [ "$fn" = "data-gateway" ] || [ "$fn" = "quotations-gateway" ]; then
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
            else
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            fi
          done
          echo "Done."
