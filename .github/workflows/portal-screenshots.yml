name: Portal screenshot check

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public URL to capture (preview or production)"
        required: true
        default: "https://surepath-git-feat-pathy-icons-all-portals-roollaanndds-projects.vercel.app"
  push:
    branches: [main]
    paths:
      - ".github/workflows/portal-screenshots.yml"
  pull_request:
    paths:
      - ".github/workflows/portal-screenshots.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture portal pages
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://surepath-git-feat-pathy-icons-all-portals-roollaanndds-projects.vercel.app' }}
        run: |
          mkdir -p screenshots
          cat > /tmp/capture.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
            page.setDefaultTimeout(15000);
            const base = process.env.TARGET_URL.replace(/\/$/, '');
            const paths = [
              ['home', '/'],
              ['agentapp', '/agentapp'],
              ['agent', '/agent'],
              ['login', '/login']
            ];
            for (const [name, path] of paths) {
              try {
                const response = await page.goto(base + path, { waitUntil: 'networkidle', timeout: 30000 });
                await page.screenshot({ path: `screenshots/${name}.png`, fullPage: true });
                console.log(`${name}: status=${response ? response.status() : 'no-response'} url=${page.url()} title=${await page.title()}`);
              } catch (e) {
                console.log(`${name}: ERROR ${e.message}`);
              }
            }
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
          node /tmp/capture.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surepath-portal-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 7
