name: Sync email secrets to Supabase
# One-way bridge (2026-10-30): GitHub repo secrets -> Supabase edge secrets.
#
# Purpose: the owner puts RESEND_API_KEY (and optionally ADMIN_DIGEST_EMAIL)
# as GITHUB repository secrets — never in chat. Pressing "Run workflow"
# pushes them into the edge runtime so the email functions (daily-report,
# send-insurer-email, insurer-reminder-cron, data-gateway orders) can send.
#
# Safety:
# - Dispatch-only: nothing runs on push automatically.
# - Secret VALUES are never echoed; only per-secret sync outcomes.
# - Empty optional secrets are skipped (never overwritten with empty).
# - The optional daily-report test ROTATES CRON_SECRET, which invalidates any
#   Authorization header stored in the Supabase Dashboard cron schedule for
#   daily-report (default: false, so scheduled runs keep their secret).
on:
  workflow_dispatch:
    inputs:
      include_daily_report_test:
        description: 'true = rotate CRON_SECRET + test-invoke daily-report (breaks Dashboard cron header until re-saved)'
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repo secrets (fail clean when owner has not added them yet)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_DIGEST_EMAIL: ${{ secrets.ADMIN_DIGEST_EMAIL }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${RESEND_API_KEY//[[:space:]]/}" ]; then
            echo "::error::GitHub secret RESEND_API_KEY belum diisi. Tambahkan di repo Settings > Secrets and variables > Actions (JANGAN lewat chat), lalu jalankan ulang workflow ini."
            missing=1
          fi
          if [ -z "${ADMIN_DIGEST_EMAIL//[[:space:]]/}" ]; then
            echo "::notice::ADMIN_DIGEST_EMAIL kosong (opsional) — digest email akan berjalan dengan penerima MASTER/ADMIN dari sp_users. Boleh diisi belakangan."
          fi
          if [ "$missing" = "1" ]; then exit 1; fi

      - name: Push secrets to Supabase (POST batch, names printed only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_DIGEST_EMAIL: ${{ secrets.ADMIN_DIGEST_EMAIL }}
        run: |
          set -euo pipefail
          TOK="${SUPABASE_ACCESS_TOKEN//[[:space:]]/}"
          digest="${ADMIN_DIGEST_EMAIL//[[:space:]]/}"
          payload=$(jq -n --arg k "${RESEND_API_KEY//[[:space:]]/}" --arg e "$digest" \
            '{secrets: ([{name: "RESEND_API_KEY", value: $k}] +
              (if $e == "" then [] else [{name: "ADMIN_DIGEST_EMAIL", value: $e}] end))}')
          code=$(curl -sS -o /tmp/push.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${TOK}" -H 'Content-Type: application/json' \
            -d "$payload")
          if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "204" ]; then
            echo "::notice::POST /secrets OK (HTTP ${code}) — synced: $(jq -r '.secrets[].name' <<<"$payload" | tr '\n' ',' | sed 's/,$//')"
          else
            echo "::error::POST /secrets failed: HTTP ${code}"
            jq -c '{message}' /tmp/push.json 2>/dev/null || true
            exit 1
          fi

      - name: Optional — rotate CRON_SECRET and test-invoke daily-report
        if: ${{ inputs.include_daily_report_test == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          TOK="${SUPABASE_ACCESS_TOKEN//[[:space:]]/}"
          CRON_SECRET="$(openssl rand -hex 32)"
          code=$(curl -sS -o /tmp/cron.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/secrets" \
            -H "Authorization: Bearer ${TOK}" -H 'Content-Type: application/json' \
            -d "{\"secrets\": [{\"name\": \"CRON_SECRET\", \"value\": \"${CRON_SECRET}\"}]}")
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
            echo "::error::POST CRON_SECRET failed: HTTP ${code}"
            jq -c '{message}' /tmp/cron.json 2>/dev/null || true
            exit 1
          fi
          echo "::notice::CRON_SECRET baru terpasang di edge (value tidak dicetak)"
          code2=$(curl -sS -o /tmp/dr.json -w '%{http_code}' -X POST \
            "https://${PROJECT_REF}.supabase.co/functions/v1/daily-report" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          if [ "$code2" = "200" ]; then
            # Response shape: {ok, channels:{email:{ok,status,recipients}, ...}} — no PII.
            echo "::notice::daily-report HTTP 200 — $(jq -c '.channels' /tmp/dr.json)"
            if jq -e '.channels.email.ok == true' /tmp/dr.json >/dev/null 2>&1; then
              echo "::notice::EMAIL TERKIRIM via Resend (channels.email.ok=true, status=$(jq '.channels.email.status' /tmp/dr.json))"
            else
              echo "::notice::email belum terkirim: $(jq -c '.channels.email' /tmp/dr.json)"
            fi
          else
            echo "::error::daily-report invocation failed: HTTP ${code2}"
            head -c 300 /tmp/dr.json || true
            exit 1
          fi
          echo "::warning::Jangan lupa: bila cron harian daily-report di Supabase Dashboard menyimpan header Authorization lama, perbarui header-nya dengan secret baru ini atau ganti ke SECRET dari DBVault per dokumentasi."
