name: Remediate vulnerable dependencies

on:
  push:
    branches:
      - security/defense-in-depth-baseline
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    if: "!contains(github.event.head_commit.message, '[security-deps-bot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking dependency security updates
        run: npm audit fix
      - name: Require production dependency audit to pass
        run: npm audit --omit=dev --audit-level=high
      - name: Verify typecheck, lint, tests, and build
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit lockfile-only remediation
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "[security-deps-bot] Remediate vulnerable dependencies"
          git push origin HEAD:${{ github.ref_name }}
