name: Inspect Supabase Auth config
# Read-only diagnostic (2026-10-30): the owner was asked to disable email
# auto-confirm by hand, and the trust gate's email_confirmed_at signal
# becomes meaningful only after that. Rather than trusting an assumption,
# read the live config through the Management API and surface the result
# as PUBLIC annotations (check-run annotations are readable without admin).
# No values are changed here. Printing is limited to booleans/flags —
# never secrets, URLs, or user data.
on:
  push:
    paths: ['.github/workflows/supabase-auth-inspect.yml']
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read auth config (GET only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          TOK="${SUPABASE_ACCESS_TOKEN//[[:space:]]/}"
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${TOK}")
          if [ "$code" != "200" ]; then
            echo "::error::GET /config/auth failed: HTTP ${code}"
            jq -c '{message}' /tmp/auth.json 2>/dev/null || true
            exit 1
          fi
          autoconfirm=$(jq -r '.mailer_autoconfirm | tostring' /tmp/auth.json)
          disable=$(jq -r '.disable_signup | tostring' /tmp/auth.json)
          allow_unv=$(jq -r '.mailer_allow_unverified_email_sign_ins | tostring' /tmp/auth.json)
          ext_email=$(jq -r '.external_email_enabled | tostring' /tmp/auth.json)
          has_smtp=$(jq -r '(.smtp_host // "") | if length > 0 then "true" else "false" end' /tmp/auth.json)
          echo "::notice::mailer_autoconfirm=${autoconfirm} (strict: false = auto-confirm SUDAH MATI; true = masih menyala)"
          echo "::notice::disable_signup=${disable}"
          echo "::notice::mailer_allow_unverified_email_sign_ins=${allow_unv}"
          echo "::notice::external_email_enabled=${ext_email}"
          echo "::notice::custom_smtp_configured=${has_smtp}"
          # ── Perilaku nyata (agregat, TANPA PII): berapa akun baru yang
          #    terkonfirmasi <5 detik = auto-confirm masih menyala.
          q='select to_jsonb(x) from (select count(*)::int as total_users, count(*) filter (where created_at > now() - interval '"'"'30 days'"'"')::int as created_30d, count(*) filter (where created_at > now() - interval '"'"'30 days'"'"' and email_confirmed_at is not null and extract(epoch from (email_confirmed_at - created_at)) < 5)::int as sub5s_30d, count(*) filter (where created_at > now() - interval '"'"'30 days'"'"' and email_confirmed_at is not null)::int as confirmed_30d) x;'
          code2=$(curl -sS -o /tmp/q.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${TOK}" -H 'Content-Type: application/json' \
            -d "{\"query\": $(jq -Rs . <<<"$q")}")
          if [ "$code2" = "200" ]; then
            echo "::notice::users-aggregate=$(jq -c '.[0]' /tmp/q.json)"
          else
            echo "::notice::users-aggregate=POST query failed HTTP ${code2}"
            echo "::notice::users-aggregate-body=$(jq -c '{message,error,error_code?}' /tmp/q.json 2>/dev/null | head -c 300)"
          fi
