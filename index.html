    <!-- PWA install capture — MUST stay here, above every bundle.
         Chrome fires `beforeinstallprompt` once, right after its installability
         check passes, and never replays it. Our install buttons live in React
         components (one of them in a lazily-loaded chunk), so a listener added
         in a useEffect regularly missed the event entirely — and the buttons
         then fell back to "open the ⋮ menu" instructions, which only produce a
         browser shortcut instead of a real install. Parking the event on
         window here means services/pwaInstall.ts can always find it, however
         late the app mounts. -->
    <script>
      (function () {
        var b = (window.__spInstall = window.__spInstall || { event: null, installed: false });
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();          // suppress the mini-infobar; we show our own sheet
          b.event = e;
          b.installed = false;         // the browser only offers to install what isn't installed
          window.dispatchEvent(new Event('sp:installability'));
        });
        window.addEventListener('appinstalled', function () {
          b.event = null;
          b.installed = true;
          window.dispatchEvent(new Event('sp:installability'));
        });
      })();
    </script>

    <script>
      // Put the stored theme on <html> before first paint. Without this the page
      // paints light, React mounts, and only then does the `dark` class land —
      // a white flash on every load for anyone using dark mode.
      //
      // Only an explicitly stored 'true' turns it on here. A user who has never
      // chosen gets light, which is what five of the six portals open as; the
      // Admin CMS opens dark from its own fallback once it mounts. The single
      // owner of this state is components/shared/theme.ts — this is just the
      // early read of the same key.
      try {
        if (localStorage.getItem('sp_dark_mode') === 'true') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        // Private mode / blocked storage: no preference to honour, carry on light.
      }
    </script>

      /* `body` reads the design tokens, like everything else. It used to hardcode

         surface behind every page was the one surface that never followed the
         theme: tokens on :root flipped, `body` stayed light.

         The literals below are fallbacks for the first paint only, before
         styles.css (imported by the bundle) defines the tokens — so they must
         stay equal to the token values there, light and dark. */
      body {
