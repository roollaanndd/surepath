name: Temporary security lockfile refresh

on:
  push:
    branches:
      - security/dependency-audit-remediation
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  validate-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-remediation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security(deps): refresh lockfile for patched packages"
            git push origin HEAD:security/dependency-audit-remediation
          fi
      - name: Install exactly from lockfile
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run lint, type checks, and unit tests
        run: npm run lint
      - name: Build production application
        run: npm run build
