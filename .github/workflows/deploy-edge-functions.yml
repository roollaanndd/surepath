# SurePath — Edge Function Auto-Deploy
#
# Deploys Supabase edge functions from the repo's real source on every push to
# main that touches supabase/functions/**. This removes the long-standing manual
# `supabase functions deploy` step that repeatedly left the production
# data-gateway bundle stale behind the repo (see CHANGELOG v1.51–v1.53 deploy
# notes).
#
# It deploys the functions the push actually changed (v2.5.0). Before that it
# always deployed data-gateway regardless of what changed, which is why
# pathy-agent stayed two releases behind production while this workflow ran
# green on the very pushes that updated it. A change under _shared/ redeploys
# every function, since they all import from there.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — uyjgeteelnswphyzkjwi
#
# Until those secrets are set, this workflow no-ops instead of failing the run —
# and as of 10 Sep 2026 they are still not set, so it has never actually
# deployed anything. The skip is written to the run summary so that fact is
# visible on the run page rather than buried in a skipped step.

name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names to deploy (blank = data-gateway)'
        required: false
        default: 'data-gateway'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the push is diffed against its `before` SHA to find
          # which functions changed, and a shallow clone may not contain it.
          fetch-depth: 0

      # Deploying only data-gateway on every push was the reason pathy-agent sat
      # two releases behind production: the push that changed it triggered this
      # workflow and then deployed something else. Deploy what the push touched.
      - name: Resolve functions to deploy
        id: resolve
        env:
          MANUAL: ${{ github.event.inputs.functions }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL:-}" ]; then
            echo "functions=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "functions=data-gateway" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Changed paths under supabase/functions/<name>/…, minus _shared —
          # a change there affects every function that imports it, so in that
          # case redeploy the whole set.
          before="${{ github.event.before }}"
          if ! changed=$(git diff --name-only "$before" "${{ github.sha }}" -- 'supabase/functions/**' 2>/dev/null); then
            # Force-push, first push on a branch, or a missing base object.
            # Deploying everything is the safe direction here: the failure this
            # workflow exists to prevent is a function silently NOT deploying.
            echo "::warning::Could not diff against $before — deploying every function."
            changed=""
            all=1
          fi
          if [ "${all:-0}" = "1" ] || echo "$changed" | grep -q '^supabase/functions/_shared/'; then
            fns=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' -printf '%f\n' | sort | tr '\n' ' ')
          elif [ -z "$changed" ]; then
            fns=""
          else
            fns=$(echo "$changed" | awk -F/ '{print $3}' | grep -v '^_shared$' | sort -u | tr '\n' ' ')
          fi
          echo "Deploying: $fns"
          echo "functions=$fns" >> "$GITHUB_OUTPUT"

      # This has been skipping since the workflow was added — the secrets were
      # never set — and a skipped step inside a green run is invisible, so the
      # functions quietly stayed stale while every run reported success. The
      # skip now writes to the run summary, where it is actually read.
      - name: Guard — secrets present?
        id: guard
        env:
          FNS: ${{ steps.resolve.outputs.functions }}
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_REF }}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set — skipping edge-function deploy. Add them in repo Settings → Secrets to enable auto-deploy."
            {
              echo "## ⚠️ Edge functions NOT deployed"
              echo
              echo "Changed and awaiting deploy: \`${FNS:-none}\`"
              echo
              echo "\`SUPABASE_ACCESS_TOKEN\` / \`SUPABASE_PROJECT_REF\` are not set, so this run deployed nothing."
              echo "Add them in **Settings → Secrets and variables → Actions**, then re-run this workflow."
              echo
              echo "Until then the production functions stay on their previous version and must be deployed by hand:"
              echo
              echo '```'
              for fn in ${FNS:-}; do echo "supabase functions deploy $fn --project-ref uyjgeteelnswphyzkjwi"; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.guard.outputs.ready == 'true' && steps.resolve.outputs.functions != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        if: steps.guard.outputs.ready == 'true' && steps.resolve.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FUNCTIONS: ${{ steps.resolve.outputs.functions }}
        run: |
          set -euo pipefail
          for fn in $FUNCTIONS; do
            echo "Deploying $fn to $PROJECT_REF ..."
            # data-gateway authenticates internally (Bearer JWT verified in code
            # for private actions; PUBLIC_ACTIONS allowlist for the rest), so it
            # runs with --no-verify-jwt exactly as the manual deploys did.
            if [ "$fn" = "data-gateway" ] || [ "$fn" = "quotations-gateway" ]; then
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
            else
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            fi
          done
          echo "Done."
