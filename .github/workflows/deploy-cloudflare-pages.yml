# SurePath — Cloudflare Pages (second deploy path for the frontend)
#
# Why this exists: the frontend has exactly one way to reach users, and it is
# rate limited. Vercel charges "deployments created per day" to the ACCOUNT,
# not the project (rate-limit id api-deployments-free-per-day: 100 every
# 86400s, plus 100/hour and 60 per five minutes). On 24 Oct 2026 the account
# spent 52 deployments in 5.5 hours — 45 of them previews nobody read — and
# hit the cap at 07:48. The merge to main that followed could not deploy at
# all: main sat a commit ahead of production with no way to ship it, and no
# CLI flag gets around it, because `vercel deploy --prebuilt --prod`, a deploy
# hook and a git push all create a deployment and all draw on the same bucket.
#
# vercel.json now turns preview deployments off for every working-branch
# pattern, which removes the cause. This workflow removes the single point of
# failure: the same dist/ can go live on Cloudflare Pages, whose free tier
# meters builds per month (500) rather than deploys per day, and which we do
# not share a quota with.
#
# It builds from the repo, so it does not depend on Vercel having built
# anything. public/_headers and public/_redirects carry the CSP, the caching
# and the SPA fallback that vercel.json carries on Vercel, so a page served
# from either host behaves the same.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with the "Cloudflare Pages:Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
#   VITE_SUPABASE_URL      — same value Vercel builds with
#   VITE_SUPABASE_ANON_KEY — same value Vercel builds with
#   VITE_SENTRY_DSN        — optional
#
# Until those are set the run no-ops and says so in the run summary rather
# than failing, so the standby path can sit here unused without turning every
# push red. Setting them does NOT move myinsurepath.com: Pages serves the
# build on its own *.pages.dev URL, and DNS stays on Vercel until somebody
# changes it by hand. See docs/DEPLOY_FALLBACK.md.

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      project:
        description: 'Cloudflare Pages project name'
        required: false
        default: 'surepath'

concurrency:
  # One build per branch. A burst of merges should leave one live build, not a
  # queue of them — the habit that exhausted the Vercel quota in the first place.
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — secrets present?
        id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — the standby deploy path is dormant."
            {
              echo "## ℹ️ Cloudflare Pages standby path is dormant"
              echo
              echo "This run built and deployed nothing. That is the configured state, not a failure."
              echo
              echo "To arm it, add these in **Settings → Secrets and variables → Actions**:"
              echo
              echo "| Secret | Where it comes from |"
              echo "| --- | --- |"
              echo "| \`CLOUDFLARE_API_TOKEN\` | Cloudflare → My Profile → API Tokens, template **Edit Cloudflare Workers**, or a custom token with *Cloudflare Pages: Edit* |"
              echo "| \`CLOUDFLARE_ACCOUNT_ID\` | Cloudflare dashboard sidebar |"
              echo "| \`VITE_SUPABASE_URL\` | the same value Vercel builds with |"
              echo "| \`VITE_SUPABASE_ANON_KEY\` | the same value Vercel builds with |"
              echo
              echo "Arming it does **not** move myinsurepath.com. See \`docs/DEPLOY_FALLBACK.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.guard.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build

      # _headers and _redirects live in public/, so vite copies them into dist/
      # verbatim. If they ever stop arriving, the deploy still succeeds and the
      # site silently loses its CSP and its deep links — so check, and fail loudly.
      - name: Verify static-host config reached dist/
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          missing=0
          for f in _headers _redirects _fallback.html; do
            if [ ! -f "dist/$f" ]; then
              echo "::error::dist/$f is missing — Cloudflare Pages would serve the app without it."
              missing=1
            fi
          done
          grep -q 'Content-Security-Policy' dist/_headers || {
            echo "::error::dist/_headers carries no Content-Security-Policy."; missing=1; }
          grep -q '_fallback.html  *200' dist/_redirects || {
            echo "::error::dist/_redirects has no SPA fallback rule — every deep link would 404."; missing=1; }
          [ "$missing" = "0" ]

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ github.event.inputs.project || 'surepath' }}
            --branch=main
            --commit-dirty=true
