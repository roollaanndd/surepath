apply plugin: 'com.android.application'

android {
    namespace = "com.myinsurepath.os"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.myinsurepath.os"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Kept in step with src/version.ts by scripts/sync-android-version.mjs
        // (run as part of `npm run build:android`). This drifted to 1.0.1 while
        // the app shipped 2.5.11 — a Play upload carrying the wrong version is
        // impossible to correlate with a crash report or a changelog entry.
        versionCode 67
        versionName "2.8.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ── Signing config for release builds ──────────────────────────────────
    // The keystore file (surepath-release.keystore) must be placed in
    // android/app/ before building. Generate one with:
    //   keytool -genkey -v -keystore surepath-release.keystore -keyalg RSA
    //     -keysize 2048 -validity 10000 -alias surepath
    // Credentials are read from keystore.properties (NOT committed to git).
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            // Generate APK for testing + AAB for Play Store
        }
        debug {
            minifyEnabled false
        }
    }

    // Play Store requires Android App Bundle (AAB)
    bundle {
        language { enableSplit = false }
        density { enableSplit = false }
        abi { enableSplit = true }
    }

    // ── Per-role download packages (docs/APP_SEPARATION_PLAN.md, Fase 1) ────
    // Zero component-code changes: every flavor builds the very same web
    // bundle (webDir 'dist') and the same Java sources — only the package
    // identity differs, so each role installs/updates its own listing.
    // `base` keeps the original applicationId and the original behaviour as
    // shipped today. Role flavors add an applicationId suffix and an app label
    // override (src/<flavor>/res/values/strings.xml).
    // Deliberately NOT overridden per flavor: custom_url_scheme /
    // package_name (strings.xml) — payment/OAuth deep links must keep
    // resolving to com.myinsurepath.os inside every install.
    flavorDimensions "app"
    productFlavors {
        base {
            dimension "app"
        }
        nasabah {
            dimension "app"
            applicationIdSuffix ".nasabah"
        }
        mitra {
            dimension "app"
            applicationIdSuffix ".mitra"
        }
        operator {
            dimension "app"
            applicationIdSuffix ".operator"
        }
        admin {
            dimension "app"
            applicationIdSuffix ".admin"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
